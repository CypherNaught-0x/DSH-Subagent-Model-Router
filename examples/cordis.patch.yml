# Add this id-targeted entry to ~/.dsh/profiles/web/cordis.patch.yml after
# installing the plugin. Replace these routes with values reported by
# model_subagent_catalog.
- id: dsh-subagent-dynamic-model
  config:
    subagentProvider: spawn
    toolName: subagent_model
    maxDepth: 3
    enableRunInBackground: true
    models:
      - alias: fast
        provider: acme
        model: acme-fast
        displayName: Acme Fast
        tags: [fast, routine]
        description: Use for quick, well-scoped tasks where low latency matters.
      - alias: deep
        provider: acme
        model: acme-reasoner
        displayName: Acme Reasoner
        tags: [reasoning, review]
        description: Use for difficult analysis, architecture decisions, and adversarial review.
        # DSH rc.6 does not restore this cap after a cold continuable resume.
        maxTokens: 16384
